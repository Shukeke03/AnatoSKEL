[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anatoskel"
version = "1.0.0"
description = "CT-conditioned patient-specific vertebral reconstruction research implementation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0", "numpy==1.26.4", "scipy==1.16.2", "nibabel==5.3.2",
  "scikit-image==0.25.2", "trimesh==4.8.3", "PyYAML==6.0.2",
  "monai==1.5.1", "einops==0.8.1"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[project.scripts]
anatoskel = "anatoskel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
